apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dclaw-app.fullname" . }}-backend
  labels:
    app: {{ include "dclaw-app.name" . }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dclaw-app.name" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "dclaw-app.name" . }}
        component: backend
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: {{ .Values.metrics.path | quote }}
      {{- end }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8146
          envFrom:
            - secretRef:
                name: {{ include "dclaw-app.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health/
              port: 8146
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/
              port: 8146
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dclaw-app.fullname" . }}-frontend
  labels:
    app: {{ include "dclaw-app.name" . }}
    component: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dclaw-app.name" . }}
      component: frontend
  template:
    metadata:
      labels:
        app: {{ include "dclaw-app.name" . }}
        component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - containerPort: 3060
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
