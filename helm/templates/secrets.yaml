{{- $owner := .Values.postgres.cnpg.owner -}}
{{- $pwd := .Values.postgres.cnpg.password | default "change-me" -}}
{{- $db := .Values.postgres.cnpg.database -}}
{{- $host := printf "%s-pg-rw" (include "dclaw-app.fullname" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-app.fullname" . }}-secrets
type: Opaque
stringData:
  {{- if .Values.postgres.cnpg.enabled }}
  DATABASE_URL: "postgresql+asyncpg://{{ $owner }}:{{ $pwd }}@{{ $host }}:5432/{{ $db }}"
  {{- else }}
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/dclaw_vendor"
  {{- end }}
  DB_SCHEMA: "{{ .Values.postgres.schema }}"
  APP_ENV: "production"
  SECRET_KEY: "change-me-in-production"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OPENROUTER_API_KEY: ""
{{- if .Values.postgres.cnpg.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dclaw-app.fullname" . }}-pg-creds
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.cnpg.owner }}
  password: {{ .Values.postgres.cnpg.password | default "change-me" | quote }}
{{- end }}
