version: "3.9"

# Postgres is NOT defined here — all DClaw apps share the one local Postgres in
# ../dclaw-local-db (started by ../dclaw-up.sh). This app uses database
# dclaw_vendor on that shared server, reached over the external "dclaw-net" network.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@dclaw-postgres:5432/dclaw_vendor
      APP_ENV: production
    ports:
      - "8146:8146"
    networks:
      - dclaw-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8146/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8146
    environment:
      PORT: 3060
    ports:
      - "3060:3060"
    networks:
      - dclaw-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3060/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dclaw-net:
    external: true
