version: "3.9"

# Self-contained stack — bundles its own Postgres so the app runs with ONE
# command and no external setup:
#
#   docker compose -f docker-compose.standalone.yml up
#
# Postgres is internal-only (not published to the host), so multiple DClaw
# apps can run at the same time without colliding on 5432. App at
# http://localhost:3060 (frontend) / http://localhost:8146 (backend).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dclaw
      POSTGRES_PASSWORD: dclaw
      POSTGRES_DB: dclaw_vendor
    volumes:
      - vendor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclaw -d dclaw_vendor"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dclaw:dclaw@postgres:5432/dclaw_vendor
      APP_ENV: production
    ports:
      - "8146:8146"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8146/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8146
    environment:
      PORT: 3060
    ports:
      - "3060:3060"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3060/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vendor_pgdata:
